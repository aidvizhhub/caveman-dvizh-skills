# Страж скриптов: синтаксис + shellcheck (линтер для bash, как в индустрии).
# Экшены не сторонние — ставим shellcheck на самом раннере (ubuntu).
name: lint

# paths-фильтр убран: иначе проверка не запускается на PR с одними .md
# и required check "shellcheck" вечно висит в ожидании — ветка запирается.
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Поставить shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Синтаксис всех скриптов
        run: bash -n *.sh
      - name: Shellcheck (главные ошибки валят CI)
        run: shellcheck --severity=warning -e SC1091 *.sh
